name: Build SDF.R V17.0.0 Cross Platform

# V16.2.2 までと同じ構成。3OS とも同じ Rust-GPU-SDF-V17.0.0_CI ツリーからビルドする
# (build_sdf_addon.sh が uname で Darwin/Linux を見分け、Windows は .ps1)。
# V17.0.0 はギズモ実装によるメジャーアップデート。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-sdf-r-v17-0-0-cross-platform.yml"
      - "Rust-GPU-SDF-V17.0.0_CI/**"

env:
  TREE: Rust-GPU-SDF-V17.0.0_CI

jobs:
  build-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Rust-GPU-SDF-V17.0.0_CI
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS addon zip
        run: |
          chmod +x build_sdf_addon.sh
          set +e
          ./build_sdf_addon.sh 2>&1 | tee build-macos.log
          exit_code=${PIPESTATUS[0]}
          echo "macOS build exit code: ${exit_code}"
          exit ${exit_code}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDF_R_17_0_0_MAC_logs
          path: Rust-GPU-SDF-V17.0.0_CI/build-macos.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SDF_R_17_0_0_MAC
          path: Rust-GPU-SDF-V17.0.0_CI/SDF_R_17_0_0_Darwin.zip

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Rust-GPU-SDF-V17.0.0_CI
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev
      - name: Build Linux addon zip
        run: |
          chmod +x build_sdf_addon.sh
          set +e
          ./build_sdf_addon.sh 2>&1 | tee build-linux.log
          exit_code=${PIPESTATUS[0]}
          echo "Linux build exit code: ${exit_code}"
          exit ${exit_code}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDF_R_17_0_0_LINUX_logs
          path: Rust-GPU-SDF-V17.0.0_CI/build-linux.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SDF_R_17_0_0_LINUX
          path: Rust-GPU-SDF-V17.0.0_CI/SDF_R_17_0_0_Linux.zip

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Rust-GPU-SDF-V17.0.0_CI
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows addon zip
        run: |
          ./build_sdf_addon.ps1 2>&1 | Tee-Object -FilePath build-windows.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDF_R_17_0_0_WIN_logs
          path: Rust-GPU-SDF-V17.0.0_CI/build-windows.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SDF_R_17_0_0_WIN
          path: Rust-GPU-SDF-V17.0.0_CI/SDF_R_17_0_0.zip
