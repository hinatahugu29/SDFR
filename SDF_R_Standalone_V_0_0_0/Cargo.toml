[package]
name = "sdf_r_standalone"
version = "0.0.0"
edition = "2021"

[dependencies]
# Rendering & Windowing
wgpu = "0.19"
winit = { version = "0.29", features = ["rwh_05"] }
pollster = "0.3"

# UI
egui = "0.26"
egui-wgpu = "0.26"
egui-winit = "0.26"

# Math & Data
glam = { version = "0.27", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.13", features = ["derive"] }
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
futures = "0.3"
instant = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.12"
